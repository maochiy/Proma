# electron-builder 配置
# 文档: https://www.electron.build/configuration/configuration

appId: com.proma.app
productName: Proma
copyright: Copyright © 2024-2026 Erlich Liu

# Electron 版本（CI 环境 bun workspace 下无法自动检测，需显式指定）
electronVersion: 39.5.1

# 目录配置
directories:
  output: out
  buildResources: resources

# 压缩配置
compression: normal

# afterPack Hook：
# 1) 修复 macOS extraResources 中 proma CLI 被复制后损坏的代码签名，并 smoke test
#    （无效签名在 arm64 上会 SIGKILL / exit 137，导致 Agent 内 proma session 全挂）
# 2) Windows extraResources 中的 .exe 会在复制期间被 electron-builder 签名并改变字节，
#    负责刷新 CCB Runtime Manifest 中对应的 SHA-256。
afterPack: dist/electron-builder-after-pack.cjs
afterSign: dist/electron-builder-after-sign.cjs

# ASAR 打包配置
# CCB Runtime 通过 extraResources 独立分发，不进入 ASAR。
asar: true
asarUnpack:
  - "node_modules/@silvia-odwyer/**"
  - "node_modules/@mariozechner/**"
  - "node_modules/@napi-rs/**"
  - "node_modules/node-pty/**"

# 跳过 npm install（代码已被 esbuild/Vite 打包，npm 不识别 workspace:* 协议）
npmRebuild: false

# 通用文件配置
files:
  - dist/**/*
  - "!dist/electron-builder-after-pack.cjs"
  - "!dist/electron-builder-after-sign.cjs"
  # 排除 build:resources 脚本拷到 dist/resources 的副本（electron-builder 已通过
  # buildResources 从 resources/ 直接使用 icon/plist，避免产物里重复打包一份）
  - "!dist/resources/**"
  - package.json
  # 主进程依赖默认由 esbuild 打包；保留 node_modules 仅承载 native addon 等资源。
  - node_modules/**/*
  # 排除 workspace 包的 symlink（代码已被 esbuild/Vite 打包到 dist/ 中）
  - "!node_modules/@proma/**"
  # 排除明确只在开发/构建期使用的大体积包。
  - "!node_modules/electron/**"
  - "!node_modules/electron-builder/**"
  - "!node_modules/electronmon/**"
  - "!node_modules/esbuild/**"
  - "!node_modules/@electron/**"
  - "!node_modules/@electron-builder/**"
  - "!node_modules/@esbuild/**"

# 通用额外资源
extraResources:
  # 固定版本的 Claude Code Best Desktop Runtime Artifact。
  # 打包前由 sync:ccb-runtime 校验平台/架构/协议后复制，保持在 ASAR 外运行。
  - from: resources/ccb-runtime
    to: ccb-runtime
    filter:
      - "**/*"
  # proma CLI 自包含二进制（build:cli 用 bun build --compile 产出到 resources/bin/）。
  # 运行时由主进程注入 PROMA_CLI 环境变量，暴露给 skill / Agent 调用。
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  # 默认 Skills 模板（首次启动时同步到 ~/.proma/default-skills/）
  - from: default-skills
    to: default-skills
    filter:
      - "**/*"
  # 教程文件（教程查看器 + 欢迎对话使用）
  - from: ../../tutorial/tutorial-v2.md
    to: tutorial.md
  # Proma 品牌 Logo 素材（品牌素材下载功能使用）
  - from: resources/proma-logos
    to: proma-logos
    filter:
      - "**/*"
  # 默认 Dock 图标（macOS app.dock.setIcon 使用）
  - from: resources/icon.png
    to: icon.png

# ============================================
# macOS 配置
# ============================================
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: "Proma 需要访问麦克风，用于将你的语音实时转写为文本。"
  fileAssociations:
    - ext: proma-backup
      name: Proma Personal Backup
      role: Editor
    - ext: proma-share
      name: Proma Share Package
      role: Editor
  # 架构由 CLI 参数控制（CI 矩阵分别传 --arm64 / --x64），
  # 每个 runner 同步对应平台/架构的 CCB Runtime Artifact。
  target:
    - dmg
    - zip

# DMG 配置
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

# ============================================
# Windows 配置
# ============================================
win:
  icon: resources/icon.ico
  fileAssociations:
    - ext: proma-backup
      name: Proma Personal Backup
      icon: resources/icon.ico
    - ext: proma-share
      name: Proma Share Package
      icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64

# NSIS 安装程序配置
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# ============================================
# 发布配置
# 每个平台的 build job 通过 --publish always 直接上传到 GitHub Release。
# electron-builder 会自动创建/复用 Release，并在多架构并行上传时合并 latest-mac.yml。
# ============================================
publish:
  provider: github
  owner: maochiy
  repo: Proma
